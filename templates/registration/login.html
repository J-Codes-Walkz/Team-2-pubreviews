{% extends "base.html" %}
{% block title %}Log In — The Second City Pint{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <h1 class="h3 mb-3 text-center">Welcome Back to the Bar</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-amber w-100 py-2 mt-2">Log In</button>
                </form>
                <p class="text-center small text-muted mt-3 mb-0">
                    New to The Second City Pint? <a href="{% url 'register' %}" class="fw-semibold">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
